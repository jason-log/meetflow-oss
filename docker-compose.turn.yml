# TURN/TLS on 443 (optional) — relay for participants on networks that block UDP / non-standard ports
# usage: docker compose -f docker-compose.yml -f docker-compose.turn.yml --profile prod up -d --build
# layout: edge (nginx stream) takes public 443/tcp and routes by TLS SNI.
#   turn.<domain>  → livekit built-in TURN (TLS 443, reusing Caddy's certificate read-only)
#   everything else (meet, livekit) → caddy:443 (real client IP passed via PROXY protocol)
# requires: Docker Compose v2.24.4+ (!override), a DNS A record for turn.<domain>, firewall 3478/udp (optional).
services:
  edge:
    image: nginx:1.27-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "443:443/tcp"
    environment:
      TURN_DOMAIN: "${TURN_DOMAIN:?TURN_DOMAIN not set}"
      NGINX_ENVSUBST_OUTPUT_DIR: /etc/nginx
      NGINX_ENVSUBST_FILTER: TURN_DOMAIN
    volumes:
      - ./edge/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
    depends_on: [caddy, livekit]
    networks: [meetflow-net]

  caddy:
    ports: !override
      - "80:80"            # 443 is taken by edge (HTTP/3 on 443/udp is not used in this setup)
    environment:
      TURN_DOMAIN: "${TURN_DOMAIN:?TURN_DOMAIN not set}"
    volumes: !override
      - ./Caddyfile.turn:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  livekit:
    environment:
      LIVEKIT_TURN_ENABLED: "true"
      LIVEKIT_TURN_DOMAIN: "${TURN_DOMAIN}"
      LIVEKIT_TURN_TLS_PORT: "443"          # port advertised to clients = edge public 443
      LIVEKIT_TURN_UDP_PORT: "3478"
      LIVEKIT_TURN_PROXY_PROTOCOL: "true"   # edge adds the PROXY protocol header
      LIVEKIT_TURN_CERT_FILE: "${TURN_CERT_DIR:-/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory}/${TURN_DOMAIN}/${TURN_DOMAIN}.crt"
      LIVEKIT_TURN_KEY_FILE: "${TURN_CERT_DIR:-/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory}/${TURN_DOMAIN}/${TURN_DOMAIN}.key"
    ports:
      - "3478:3478/udp"                     # TURN/UDP (for networks where only UDP 3478 is open, optional)
    volumes: !override
      - ./livekit.turn.yaml:/etc/livekit.yaml:ro
      - caddy-data:/caddy-data:ro
