name: meetflow

services:
  redis:
    # Valkey (BSD-3, Redis-compatible) — used instead of Redis 7.4+, which is RSAL/SSPL (not OSI-approved)
    image: valkey/valkey:8.1.10-alpine
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meetflow-net]

  livekit:
    image: livekit/livekit-server:v1.13.8
    restart: unless-stopped
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?LIVEKIT_API_KEY not set - run the start script to create .env}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET not set}"
      NODE_IP: "${LIVEKIT_NODE_IP:-127.0.0.1}"
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:7880:7880"   # signaling: direct when local, via Caddy in production (not public)
      - "7881:7881/tcp"                         # ICE/TCP fallback (public)
      - "7882:7882/udp"                         # WebRTC media (public)
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [meetflow-net]

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # a separate name so the .env value wins even when the shell already has NODE_ENV set (some dev tools set it to production)
      NODE_ENV: "${MEETFLOW_ENV:-development}"
      PORT: "3000"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_PUBLIC_URL: "${LIVEKIT_PUBLIC_URL:-ws://localhost:7880}"
      LIVEKIT_INTERNAL_URL: "http://livekit:7880"
      REDIS_URL: "redis://redis:6379"
      HOST_ACCESS_CODE: "${HOST_ACCESS_CODE:?HOST_ACCESS_CODE not set}"
      MAX_PARTICIPANTS: "${MAX_PARTICIPANTS:-20}"
      ROOM_TTL_HOURS: "${ROOM_TTL_HOURS:-24}"
      TRUST_PROXY: "${TRUST_PROXY:-0}"
    ports:
      - "${LOCAL_BIND:-127.0.0.1}:${PORT:-3000}:3000"   # 127.0.0.1 in production too — outside traffic only via Caddy (443)
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [meetflow-net]

  caddy:
    image: caddy:2.10-alpine
    profiles: ["prod"]
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      APP_DOMAIN: "${APP_DOMAIN:?APP_DOMAIN not set}"
      LIVEKIT_DOMAIN: "${LIVEKIT_DOMAIN:?LIVEKIT_DOMAIN not set}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, livekit]
    networks: [meetflow-net]

volumes:
  valkey-data:
  caddy-data:
  caddy-config:

networks:
  meetflow-net:
    driver: bridge
