# LiveKit SFU configuration (MeetFlow v0.2) — for the TURN extension (mounted by docker-compose.turn.yml)
# Same as livekit.yaml plus a turn block. Domain, ports and certificate paths are filled in by compose environment variables (LIVEKIT_TURN_*).
# - The API key/secret is not written here: docker-compose passes the .env values in the LIVEKIT_KEYS environment variable.
# - The advertised IP comes from the NODE_IP environment variable (LIVEKIT_NODE_IP in .env).
#   local: 127.0.0.1 / server: its public IP. Because the public IP is set explicitly, STUN auto-detection (use_external_ip) is off.
port: 7880
bind_addresses:
  - ""
rtc:
  tcp_port: 7881        # ICE/TCP fallback for networks that block UDP
  udp_port: 7882        # single UDP port (mux) — open only 7882/udp in the firewall
  use_external_ip: false
redis:
  address: redis:6379
room:
  auto_create: false    # only rooms created by the backend after password checks exist
  empty_timeout: 600
  departure_timeout: 30
  max_participants: 20
logging:
  level: info
turn:
  # Source ranges trusted to send the PROXY protocol header added by edge (nginx) — Docker internal networks only
  proxy_protocol_trusted_cidrs:
    - 172.16.0.0/12
    - 10.0.0.0/8
    - 192.168.0.0/16
