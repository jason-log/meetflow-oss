# MeetFlow Compose file for a server with one public IP and no domain (ports kept separate from other services)
# usage: docker compose -f docker-compose.server.yml up -d --build   (create .env with scripts/init-server-env.sh)
#
# HTTPS on the IP address, no domain needed.
#   TLS_MODE=internal : Caddy self-signed certificate (accept the browser warning once) — for internal testing
#   TLS_MODE=public   : Let's Encrypt IP certificate (6-day lifetime, auto-renewed) — for inviting outside guests.
#                       Issuance/renewal checks arrive from the internet at PUBLIC_IP:443, so 443/tcp must be open to the internet.
# ports (all bound to PUBLIC_IP only, 80/tcp unused):
#   443/tcp  web, API, LiveKit signaling (/rtc path)   7881/tcp ICE/TCP   7882/udp media   3478/udp TURN/UDP
name: meetflow

services:
  redis:
    # Valkey (BSD-3, Redis-compatible) — used instead of Redis 7.4+, which is RSAL/SSPL (not OSI-approved)
    image: valkey/valkey:8.1.10-alpine
    restart: always
    command: ["valkey-server", "--appendonly", "yes"]
    volumes:
      - valkey-data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [meetflow-net]

  livekit:
    image: livekit/livekit-server:v1.13.8
    restart: always
    command: ["--config", "/etc/livekit.yaml"]
    environment:
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:?.env missing - run scripts/init-server-env.sh}: ${LIVEKIT_API_SECRET:?LIVEKIT_API_SECRET not set}"
      NODE_IP: "${PUBLIC_IP:?PUBLIC_IP not set}"
      # TURN/UDP only (TLS needs a domain — 443 cannot be shared with an IP alone)
      LIVEKIT_TURN_ENABLED: "true"
      LIVEKIT_TURN_UDP_PORT: "3478"
    ports:
      - "${PUBLIC_IP}:7881:7881/tcp"
      - "${PUBLIC_IP}:7882:7882/udp"
      - "${PUBLIC_IP}:3478:3478/udp"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    depends_on:
      redis:
        condition: service_healthy
    networks: [meetflow-net]

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      NODE_ENV: production
      PORT: "3000"
      LIVEKIT_API_KEY: "${LIVEKIT_API_KEY}"
      LIVEKIT_API_SECRET: "${LIVEKIT_API_SECRET}"
      LIVEKIT_PUBLIC_URL: "wss://${PUBLIC_IP}"
      LIVEKIT_INTERNAL_URL: "http://livekit:7880"
      REDIS_URL: "redis://redis:6379"
      HOST_ACCESS_CODE: "${HOST_ACCESS_CODE:?HOST_ACCESS_CODE not set}"
      MAX_PARTICIPANTS: "${MAX_PARTICIPANTS:-20}"
      ROOM_TTL_HOURS: "${ROOM_TTL_HOURS:-24}"
      TRUST_PROXY: "1"
      TZ: Asia/Seoul
    read_only: true
    tmpfs: ["/tmp"]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      redis:
        condition: service_healthy
      livekit:
        condition: service_started
    networks: [meetflow-net]

  caddy:
    image: caddy:2.11.4-alpine
    restart: always
    environment:
      PUBLIC_HOST: "${PUBLIC_IP}"
      TLS_MODE: "${TLS_MODE:-internal}"
    ports:
      - "${PUBLIC_IP}:443:443/tcp"
    volumes:
      - ./Caddyfile.server:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [backend, livekit]
    networks: [meetflow-net]

volumes:
  valkey-data:
  caddy-data:
  caddy-config:

networks:
  meetflow-net:
    driver: bridge
